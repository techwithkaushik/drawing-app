name: Build APK

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ '**.md' ]

  pull_request:
    branches: [ "main" ]
    paths-ignore: [ '**.md' ]

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Avoid the upstream validation service's intermittent network timeouts.
      - name: Validate Gradle wrapper files
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          bash -n ./gradlew

  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: bash ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: drawing-app
          path: app/build/outputs/apk/debug/**.apk
